<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>21-Day Full-Stack / Frontend Interview Sprint Tracker</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-hover: #26354d;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-dark: #0284c7;
        --dsa: #818cf8;
        --gfe: #34d399;
        --sys: #fbbf24;
        --rev: #f472b6;
        --danger: #f87171;
        --success: #22c55e;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        padding-bottom: 60px;
      }

      header {
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border-bottom: 1px solid var(--border);
        padding: 20px 24px;
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(8px);
      }

      .header-container {
        max-width: 1320px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .title-area h1 {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .stack-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }

      .pill {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--accent);
        border: 1px solid rgba(56, 189, 248, 0.25);
        text-decoration: none;
      }

      .pill:hover {
        background: rgba(56, 189, 248, 0.25);
      }

      .timer-widget {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg);
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }

      .timer-display {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--accent);
        min-width: 68px;
        text-align: center;
      }

      .btn {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 11px;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .btn:hover {
        background: var(--surface-hover);
        border-color: var(--accent);
      }

      .btn-primary {
        background: var(--accent-dark);
        border-color: var(--accent);
        color: #fff;
      }

      .stats-bar {
        max-width: 1320px;
        margin: 14px auto 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }

      .stat-card {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
      }

      .stat-card-header {
        display: flex;
        justify-content: space-between;
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-weight: 600;
      }

      .progress-track {
        width: 100%;
        height: 8px;
        background: var(--bg);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
        border-radius: 999px;
      }

      main {
        max-width: 1320px;
        margin: 24px auto;
        padding: 0 24px;
      }

      .controls-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 14px;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tab-btn {
        background: var(--surface);
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .tab-btn:hover {
        color: var(--text);
        background: var(--surface-hover);
      }

      .tab-btn.active {
        background: var(--accent-dark);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      select,
      input[type='search'] {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 7px 12px;
        border-radius: 6px;
        font-size: 0.82rem;
      }

      .days-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .day-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        transition: border-color 0.2s;
      }

      .day-card.day-complete {
        border-color: rgba(34, 197, 94, 0.5);
      }

      .day-header {
        background: rgba(15, 23, 42, 0.55);
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        cursor: pointer;
      }

      .day-title-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .day-badge {
        background: var(--accent-dark);
        color: #fff;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 6px;
      }

      .day-title {
        font-size: 1.05rem;
        font-weight: 700;
      }

      .day-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.82rem;
        color: var(--text-muted);
      }

      .day-body {
        padding: 18px 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }

      .day-body.collapsed {
        display: none;
      }

      .block-col {
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .block-header {
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }

      .block-dsa {
        color: var(--dsa);
      }
      .block-gfe {
        color: var(--gfe);
      }
      .block-sys {
        color: var(--sys);
      }

      .task-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .task-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 6px;
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid transparent;
        transition: all 0.15s;
      }

      .task-item:hover {
        border-color: var(--border);
        background: rgba(30, 41, 59, 0.9);
      }

      .task-item.completed .task-text {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .task-item.flagged {
        border-color: rgba(248, 113, 113, 0.5);
        background: rgba(248, 113, 113, 0.08);
      }

      .task-left {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        flex: 1;
      }

      .task-left input[type='checkbox'] {
        margin-top: 4px;
        width: 16px;
        height: 16px;
        accent-color: var(--success);
        cursor: pointer;
        flex-shrink: 0;
      }

      .task-content {
        font-size: 0.86rem;
        color: var(--text);
        word-break: break-word;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }

      .task-title-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }

      .task-text {
        cursor: pointer;
      }

      .tag-chip {
        display: inline-block;
        font-size: 0.68rem;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(148, 163, 184, 0.15);
        color: var(--text-muted);
        font-weight: 600;
      }

      .task-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
      }

      .problem-link {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        transition: all 0.15s ease;
      }

      .link-nc {
        background: rgba(129, 140, 248, 0.14);
        color: #a5b4fc;
        border: 1px solid rgba(129, 140, 248, 0.3);
      }
      .link-nc:hover {
        background: rgba(129, 140, 248, 0.28);
        color: #fff;
      }

      .link-lc {
        background: rgba(251, 191, 36, 0.12);
        color: #fcd34d;
        border: 1px solid rgba(251, 191, 36, 0.3);
      }
      .link-lc:hover {
        background: rgba(251, 191, 36, 0.25);
        color: #fff;
      }

      .link-gfe {
        background: rgba(52, 211, 153, 0.14);
        color: #6ee7b7;
        border: 1px solid rgba(52, 211, 153, 0.3);
      }
      .link-gfe:hover {
        background: rgba(52, 211, 153, 0.28);
        color: #fff;
      }

      .link-sys {
        background: rgba(56, 189, 248, 0.14);
        color: #7dd3fc;
        border: 1px solid rgba(56, 189, 248, 0.3);
      }
      .link-sys:hover {
        background: rgba(56, 189, 248, 0.28);
        color: #fff;
      }

      .flag-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.85rem;
        padding: 2px 5px;
        border-radius: 4px;
        opacity: 0.6;
        transition: all 0.15s;
      }

      .flag-btn:hover,
      .task-item.flagged .flag-btn {
        opacity: 1;
        color: var(--danger);
      }

      .day-notes {
        grid-column: 1 / -1;
        background: rgba(15, 23, 42, 0.4);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
      }

      .day-notes label {
        display: block;
        font-size: 0.76rem;
        font-weight: 700;
        color: var(--rev);
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .day-notes textarea,
      .star-textarea {
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 0.84rem;
        resize: vertical;
        min-height: 54px;
      }

      .star-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 18px;
      }

      .star-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .star-card h3 {
        font-size: 1rem;
        color: var(--accent);
      }

      .star-card p {
        font-size: 0.84rem;
        color: var(--text-muted);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="title-area">
          <h1>⚡ 21-Day Full-Stack & Frontend Interview Sprint</h1>
          <div class="stack-pills">
            <a class="pill" href="https://neetcode.io/roadmap" target="_blank" rel="noopener">NeetCode Roadmap ↗</a>
            <a class="pill" href="https://www.greatfrontend.com/interviews/gfe75" target="_blank" rel="noopener">GFE 75 Hub ↗</a>
            <a class="pill" href="https://www.greatfrontend.com/front-end-system-design-playbook" target="_blank" rel="noopener">RADIO Playbook ↗</a>
            <a class="pill" href="https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction" target="_blank" rel="noopener">Hello Interview ↗</a>
            <span class="pill">TypeScript / Vue.js / Python / AWS</span>
          </div>
        </div>

        <div class="timer-widget">
          <span class="timer-display" id="timerDisplay">25:00</span>
          <button class="btn btn-primary" id="timerStartBtn" onclick="toggleTimer()">Start</button>
          <button class="btn" onclick="setTimer(25)">25m DSA</button>
          <button class="btn" onclick="setTimer(45)">45m Mock</button>
          <button class="btn" onclick="resetTimer()">Reset</button>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-card-header">
            <span>Overall Sprint Progress</span>
            <span id="overallStatText">0 / 0 (0%)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="overallProgress" style="background: var(--accent)"></div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span style="color: var(--dsa)">Morning: NeetCode DSA</span>
            <span id="dsaStatText">0 / 0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="dsaProgress" style="background: var(--dsa)"></div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span style="color: var(--gfe)">Afternoon: GFE 75 (TS/Vue)</span>
            <span id="gfeStatText">0 / 0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="gfeProgress" style="background: var(--gfe)"></div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span style="color: var(--sys)">System Design & Mocks</span>
            <span id="sysStatText">0 / 0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="sysProgress" style="background: var(--sys)"></div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="controls-row">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('week1', this)">Week 1 (Days 1–7)</button>
          <button class="tab-btn" onclick="switchTab('week2', this)">Week 2 (Days 8–14)</button>
          <button class="tab-btn" onclick="switchTab('week3', this)">Week 3 (Days 15–21)</button>
          <button class="tab-btn" onclick="switchTab('star', this)">★ Resume STAR Stories & Cheat Sheet</button>
        </div>

        <div class="filter-group">
          <input type="search" id="searchInput" placeholder="Search problem or topic..." oninput="renderDays()" />
          <select id="statusFilter" onchange="renderDays()">
            <option value="all">Show: All Tasks</option>
            <option value="todo">Show: Incomplete Only</option>
            <option value="done">Show: Completed Only</option>
            <option value="flagged">Show: 🚩 Flagged for Redo</option>
          </select>
          <button class="btn btn-primary" onclick="downloadSelfHtml()">⬇ Download .html</button>
          <button class="btn" onclick="exportProgress()">Export JSON</button>
          <button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button>
          <input type="file" id="importFile" style="display: none" accept=".json" onchange="importProgress(event)" />
        </div>
      </div>

      <div id="daysContainer" class="days-grid"></div>
      <div id="starContainer" class="star-grid hidden"></div>
    </main>

    <script>
      // URL Helper Builders
      const nc = (slug, label = 'NeetCode') => ({ label, url: `https://neetcode.io/problems/${slug}`, type: 'nc' })
      const lc = (slug, label = 'LeetCode') => ({ label, url: `https://leetcode.com/problems/${slug}/`, type: 'lc' })
      const gfe = (slug, label = 'GFE Problem') => ({ label, url: `https://www.greatfrontend.com/questions/${slug}`, type: 'gfe' })
      const gfeSys = (slug, label = 'GFE System Design') => ({ label, url: `https://www.greatfrontend.com/questions/system-design/${slug}`, type: 'sys' })
      const hi = (slug, label = 'Hello Interview') => ({ label, url: `https://www.hellointerview.com/learn/system-design/${slug}`, type: 'sys' })

      // Complete 21-Day Curriculum with Direct URLs
      const SPRINT_DATA = [
        // ================= WEEK 1 =================
        {
          day: 1,
          week: 'week1',
          title: 'Arrays & Hashing I + Core JS Timing Utilities + RADIO Intro',
          dsa: [
            { id: 'd1_dsa1', text: 'Contains Duplicate', tag: 'Easy', links: [nc('duplicate-integer'), lc('contains-duplicate')] },
            { id: 'd1_dsa2', text: 'Valid Anagram', tag: 'Easy', links: [nc('is-anagram'), lc('valid-anagram')] },
            { id: 'd1_dsa3', text: 'Two Sum', tag: 'Easy', links: [nc('two-integer-sum'), lc('two-sum')] },
            { id: 'd1_dsa4', text: 'Group Anagrams', tag: 'Medium', links: [nc('anagram-groups'), lc('group-anagrams')] },
            { id: 'd1_dsa5', text: 'Top K Frequent Elements (Bucket Sort or Heap)', tag: 'Medium', links: [nc('top-k-elements-in-list'), lc('top-k-frequent-elements')] },
          ],
          gfe: [
            {
              id: 'd1_gfe1',
              text: 'Debounce (Basic + Debounce II with cancel/flush)',
              tag: 'TS Utility',
              links: [gfe('javascript/debounce', 'Debounce I'), gfe('javascript/debounce-ii', 'Debounce II')],
            },
            { id: 'd1_gfe2', text: 'Throttle (Leading & Trailing options)', tag: 'TS Utility', links: [gfe('javascript/throttle', 'Throttle')] },
            { id: 'd1_gfe3', text: 'Array.prototype.reduce Polyfill', tag: 'JS Mechanics', links: [gfe('javascript/array-reduce', 'Array.reduce')] },
          ],
          sys: [
            {
              id: 'd1_sys1',
              text: 'Read GreatFrontEnd RADIO System Design Playbook',
              tag: 'Framework',
              links: [{ label: 'RADIO Playbook', url: 'https://www.greatfrontend.com/front-end-system-design-playbook', type: 'sys' }],
            },
            { id: 'd1_sys2', text: 'Design Autocomplete UI (Debouncing, normalized cache, ARIA)', tag: 'GFE Design', links: [gfeSys('autocomplete', 'Autocomplete Guide')] },
            { id: 'd1_sys3', text: 'End-of-Day: Log pattern triggers for Day 1', tag: 'Review', links: [] },
          ],
        },
        {
          day: 2,
          week: 'week1',
          title: 'Arrays II & Two Pointers + Recursive Array/Class Utilities',
          dsa: [
            { id: 'd2_dsa1', text: 'Product of Array Except Self (Prefix/Suffix)', tag: 'Medium', links: [nc('products-of-array-discluding-self'), lc('product-of-array-except-self')] },
            { id: 'd2_dsa2', text: 'Encode and Decode Strings', tag: 'Medium', links: [nc('string-encode-and-decode'), lc('encode-and-decode-strings')] },
            { id: 'd2_dsa3', text: 'Longest Consecutive Sequence (Set lookup)', tag: 'Medium', links: [nc('longest-consecutive-sequence'), lc('longest-consecutive-sequence')] },
            { id: 'd2_dsa4', text: 'Valid Palindrome & Two Sum II (Sorted)', tag: 'Easy/Med', links: [nc('is-palindrome', 'Valid Palindrome'), nc('two-integer-sum-ii', 'Two Sum II')] },
            { id: 'd2_dsa5', text: '3Sum (Sort + Two Pointers + Dedup)', tag: 'Medium', links: [nc('three-integer-sum'), lc('3sum')] },
          ],
          gfe: [
            { id: 'd2_gfe1', text: 'Classnames (Conditional CSS class joiner)', tag: 'TS Utility', links: [gfe('javascript/classnames', 'Classnames')] },
            { id: 'd2_gfe2', text: 'Flatten (Recursive & Iterative array flattening)', tag: 'TS Utility', links: [gfe('javascript/flatten', 'Flatten')] },
            { id: 'd2_gfe3', text: 'Array.prototype.filter & map Polyfills', tag: 'JS Mechanics', links: [gfe('javascript/array-filter', 'Array.filter'), gfe('javascript/array-map', 'Array.map')] },
          ],
          sys: [
            {
              id: 'd2_sys1',
              text: 'Design Dropdown Menu & Modal Dialog Component Architecture',
              tag: 'GFE Design',
              links: [gfeSys('dropdown-menu', 'Dropdown Menu'), gfeSys('modal-dialog', 'Modal Dialog')],
            },
            { id: 'd2_sys2', text: 'Whiteboard Portal rendering, z-index stacking & focus trapping', tag: 'UI Deep Dive', links: [] },
            { id: 'd2_sys3', text: 'End-of-Day: Re-solve 1 missed problem from Day 1', tag: 'Spaced Rep', links: [] },
          ],
        },
        {
          day: 3,
          week: 'week1',
          title: 'Sliding Window I + Deep Object Cloning + News Feed BFF Design',
          dsa: [
            { id: 'd3_dsa1', text: 'Container With Most Water', tag: 'Medium', links: [nc('max-water-container'), lc('container-with-most-water')] },
            { id: 'd3_dsa2', text: 'Best Time to Buy and Sell Stock', tag: 'Easy', links: [nc('buy-and-sell-crypto'), lc('best-time-to-buy-and-sell-stock')] },
            {
              id: 'd3_dsa3',
              text: 'Longest Substring Without Repeating Characters',
              tag: 'Medium',
              links: [nc('longest-substring-without-duplicates'), lc('longest-substring-without-repeating-characters')],
            },
            {
              id: 'd3_dsa4',
              text: 'Longest Repeating Character Replacement',
              tag: 'Medium',
              links: [nc('longest-repeating-substring-with-replacement'), lc('longest-repeating-character-replacement')],
            },
          ],
          gfe: [
            {
              id: 'd3_gfe1',
              text: 'Deep Clone (Handle objects, arrays, dates & circular refs)',

      const STORAGE_KEY = 'daniel_21day_sprint_v1'
      let state = {
        completed: {},
        flagged: {},
        collapsedDays: {},
        dayNotes: {},
        starNotes: {},
      }
      let activeTab = 'week1'

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
          if (raw) {
            state = Object.assign(state, JSON.parse(raw))
          }
        } catch (e) {
          console.error('Failed to load state:', e)
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state))
          updateStats()
        } catch (e) {
          console.error('Failed to save state:', e)
        }
      }

      function toggleTask(taskId) {
        state.completed[taskId] = !state.completed[taskId]
        saveState()
        renderDays()
      }

      function toggleFlag(taskId, event) {
        event.stopPropagation()
        state.flagged[taskId] = !state.flagged[taskId]
        saveState()
        renderDays()
      }

      function toggleCollapseDay(dayNum) {
        state.collapsedDays[dayNum] = !state.collapsedDays[dayNum]
        saveState()
        renderDays()
      }

      function updateDayNote(dayNum, value) {
        state.dayNotes[dayNum] = value
        saveState()
      }

      function updateStarNote(starId, value) {
        state.starNotes[starId] = value
        saveState()
      }

      function switchTab(tab, btnEl) {
        activeTab = tab
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
        btnEl.classList.add('active')

        const daysContainer = document.getElementById('daysContainer')
        const starContainer = document.getElementById('starContainer')

        if (tab === 'star') {
          daysContainer.classList.add('hidden')
          starContainer.classList.remove('hidden')
          renderStarStories()
        } else {
          starContainer.classList.add('hidden')
          daysContainer.classList.remove('hidden')
          renderDays()
        }
      }

      function filterMatches(task, query, statusFilter) {
        const isDone = !!state.completed[task.id]
        const isFlagged = !!state.flagged[task.id]

        if (statusFilter === 'todo' && isDone) return false
        if (statusFilter === 'done' && !isDone) return false
        if (statusFilter === 'flagged' && !isFlagged) return false

        if (query) {
          const q = query.toLowerCase()
          return task.text.toLowerCase().includes(q) || task.tag.toLowerCase().includes(q)
        }
        return true
      }

      function renderLinks(links) {
        if (!links || links.length === 0) return ''
        const badges = links
          .map(l => {
            const cls = l.type === 'nc' ? 'link-nc' : l.type === 'lc' ? 'link-lc' : l.type === 'gfe' ? 'link-gfe' : 'link-sys'
            return `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="problem-link ${cls}">${l.label} ↗</a>`
          })
          .join('')
        return `<div class="task-links">${badges}</div>`
      }

      function renderTaskBlock(title, blockClass, timeLabel, tasks, query, statusFilter) {
        const visibleTasks = tasks.filter(t => filterMatches(t, query, statusFilter))
        const itemsHtml = visibleTasks
          .map(t => {
            const isDone = !!state.completed[t.id]
            const isFlagged = !!state.flagged[t.id]
            return `
          <li class="task-item ${isDone ? 'completed' : ''} ${isFlagged ? 'flagged' : ''}">
            <div class="task-left">
              <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTask('${t.id}')" />
              <div class="task-content">
                <div class="task-title-row">
                  <span class="task-text" onclick="toggleTask('${t.id}')">${t.text}</span>
                  <span class="tag-chip">${t.tag}</span>
                </div>
                ${renderLinks(t.links)}
              </div>
            </div>
            <button class="flag-btn" title="Flag for Spaced Repetition Redo" onclick="toggleFlag('${t.id}', event)">
              🚩
            </button>
          </li>
        `
          })
          .join('')

        return `
        <div class="block-col">
          <div class="block-header ${blockClass}">
            <span>${title}</span>
            <span>${timeLabel}</span>
          </div>
          <ul class="task-list">
            ${itemsHtml || '<li style="font-size:0.8rem;color:var(--text-muted);padding:4px;">No matching tasks in filter.</li>'}
          </ul>
        </div>
      `
      }

      function renderDays() {
        const container = document.getElementById('daysContainer')
        const query = document.getElementById('searchInput').value.trim()
        const statusFilter = document.getElementById('statusFilter').value

        const weekDays = SPRINT_DATA.filter(d => d.week === activeTab)

        container.innerHTML = weekDays
          .map(d => {
            const allDayTasks = [...d.dsa, ...d.gfe, ...d.sys]
            const doneCount = allDayTasks.filter(t => state.completed[t.id]).length
            const totalCount = allDayTasks.length
            const isAllDone = doneCount === totalCount && totalCount > 0
            const isCollapsed = !!state.collapsedDays[d.day]
            const savedNote = state.dayNotes[d.day] || ''

            return `
          <div class="day-card ${isAllDone ? 'day-complete' : ''}">
            <div class="day-header" onclick="toggleCollapseDay(${d.day})">
              <div class="day-title-wrap">
                <span class="day-badge">Day ${d.day}</span>
                <span class="day-title">${d.title}</span>
              </div>
              <div class="day-meta">
                <span>${doneCount} / ${totalCount} completed ${isAllDone ? '✅' : ''}</span>
                <span>${isCollapsed ? '▼ Expand' : '▲ Collapse'}</span>
              </div>
            </div>

            <div class="day-body ${isCollapsed ? 'collapsed' : ''}">
              ${renderTaskBlock('Block 1: NeetCode DSA', 'block-dsa', '2.5 Hrs', d.dsa, query, statusFilter)}
              ${renderTaskBlock('Block 2: GFE 75 (TS / Vue UI)', 'block-gfe', '1.5 Hrs', d.gfe, query, statusFilter)}
              ${renderTaskBlock('Block 3 & 4: System Design & Review', 'block-sys', '2.0 Hrs', d.sys, query, statusFilter)}

              <div class="day-notes">
                <label>📝 Day ${d.day} Pattern Trigger & Edge Case Log (Auto-Saved)</label>
                <textarea
                  placeholder="Log 1-line triggers here (e.g. Problem -> Trigger Clue -> Invariant -> Edge Case Missed)..."
                  oninput="updateDayNote(${d.day}, this.value)"
                >${savedNote}</textarea>
              </div>
            </div>
          </div>
        `
          })
          .join('')

        updateStats()
      }

      function renderStarStories() {
        const container = document.getElementById('starContainer')
        container.innerHTML = STAR_STORIES.map(s => {
          const textVal = state.starNotes[s.id] !== undefined ? state.starNotes[s.id] : s.defaultText
          return `
          <div class="star-card">
            <h3>${s.title}</h3>
            <p>${s.prompt}</p>
            <textarea
              class="star-textarea"
              rows="7"
              oninput="updateStarNote('${s.id}', this.value)"
            >${textVal}</textarea>
          </div>
        `
        }).join('')
      }

      function updateStats() {
        let dsaTotal = 0,
          dsaDone = 0
        let gfeTotal = 0,
          gfeDone = 0
        let sysTotal = 0,
          sysDone = 0

        SPRINT_DATA.forEach(d => {
          d.dsa.forEach(t => {
            dsaTotal++
            if (state.completed[t.id]) dsaDone++
          })
          d.gfe.forEach(t => {
            gfeTotal++
            if (state.completed[t.id]) gfeDone++
          })
          d.sys.forEach(t => {
            sysTotal++
            if (state.completed[t.id]) sysDone++
          })
        })

        const overallTotal = dsaTotal + gfeTotal + sysTotal
        const overallDone = dsaDone + gfeDone + sysDone
        const overallPct = overallTotal ? Math.round((overallDone / overallTotal) * 100) : 0

        document.getElementById('overallStatText').textContent = `${overallDone} / ${overallTotal} (${overallPct}%)`
        document.getElementById('overallProgress').style.width = `${overallPct}%`

        document.getElementById('dsaStatText').textContent = `${dsaDone} / ${dsaTotal}`
        document.getElementById('dsaProgress').style.width = `${dsaTotal ? (dsaDone / dsaTotal) * 100 : 0}%`

        document.getElementById('gfeStatText').textContent = `${gfeDone} / ${gfeTotal}`
        document.getElementById('gfeProgress').style.width = `${gfeTotal ? (gfeDone / gfeTotal) * 100 : 0}%`

        document.getElementById('sysStatText').textContent = `${sysDone} / ${sysTotal}`
        document.getElementById('sysProgress').style.width = `${sysTotal ? (sysDone / sysTotal) * 100 : 0}%`
      }

      function downloadSelfHtml() {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = 'interview-sprint-tracker.html'
        document.body.appendChild(a)
        a.click()
        a.remove()
        URL.revokeObjectURL(url)
      }

      function exportProgress() {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2))
        const a = document.createElement('a')
        a.setAttribute('href', dataStr)
        a.setAttribute('download', 'interview-sprint-progress.json')
        document.body.appendChild(a)
        a.click()
        a.remove()
      }

      function importProgress(event) {
        const file = event.target.files[0]
        if (!file) return
        const reader = new FileReader()
        reader.onload = function (e) {
          try {
            const imported = JSON.parse(e.target.result)
            state = Object.assign(state, imported)
            saveState()
            renderDays()
            renderStarStories()
          } catch (err) {
            alert('Invalid JSON backup file.')
          }
        }
        reader.readAsText(file)
      }

      let timerSeconds = 25 * 60
      let defaultMinutes = 25
      let timerInterval = null

      function updateTimerDisplay() {
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0')
        const s = String(timerSeconds % 60).padStart(2, '0')
        document.getElementById('timerDisplay').textContent = `${m}:${s}`
      }

      function toggleTimer() {
        const btn = document.getElementById('timerStartBtn')
        if (timerInterval) {
          clearInterval(timerInterval)
          timerInterval = null
          btn.textContent = 'Resume'
        } else {
          btn.textContent = 'Pause'
          timerInterval = setInterval(() => {
            if (timerSeconds > 0) {
              timerSeconds--
              updateTimerDisplay()
            } else {
              clearInterval(timerInterval)
              timerInterval = null
              btn.textContent = 'Start'
              alert("⏰ Time's up! Wrap up your solution or check the walkthrough.")
            }
          }, 1000)
        }
      }

      function setTimer(mins) {
        if (timerInterval) {
          clearInterval(timerInterval)
          timerInterval = null
        }
        defaultMinutes = mins
        timerSeconds = mins * 60
        document.getElementById('timerStartBtn').textContent = 'Start'
        updateTimerDisplay()
      }

      function resetTimer() {
        setTimer(defaultMinutes)
      }

      loadState()
      renderDays()
    </script>
